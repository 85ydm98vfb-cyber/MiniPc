<!doctype html>
<html lang="ro" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watch Time">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<title>Watch Time</title>
<style>
:root{
  --done:#34C759;--more:#C04BDB;
  --bg:#000000;--panel:#141416;--panel2:#1F1F23;--line:#2B2B30;
  --text:#F2F0EA;--muted:#9A9AA2;--accent:#F4C152;--accent-ink:#241A00;
  --ok:#5CC8B0;--danger:#E8746A;--shade:rgba(0,0,0,.55);
  color-scheme:dark;
}
:root[data-theme=grey]{
  --bg:#1E1F22;--panel:#2A2B30;--panel2:#35363C;--line:#44454C;
  --text:#EFEDE8;--muted:#A6A6AE;--accent:#F4C152;--accent-ink:#241A00;
  --ok:#5CC8B0;--danger:#EC7B70;--shade:rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-theme=light]{
  --done:#1E9E45;--more:#A233C4;
  --bg:#E9ECF4;--panel:#FFFFFF;--panel2:#F0F2F8;--line:#D3D8E7;
  --text:#1A1E33;--muted:#5C6280;--accent:#D8960C;--accent-ink:#FFFFFF;
  --ok:#17917A;--danger:#C4443A;--shade:rgba(40,46,80,.18);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 "Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-optical-sizing:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
img{max-width:100%;display:block}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* bara de sus */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.top h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;font-variation-settings:"opsz" 96}
#back{font-weight:600;color:var(--accent);padding:8px 4px}

main.wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
h2{font-size:20px;font-weight:750;margin:26px 0 12px;letter-spacing:-.01em}
h2 .n{color:var(--muted);font-weight:500;margin-left:6px}
.muted{color:var(--muted)}
.loading{padding:48px 0;text-align:center;color:var(--muted)}

/* navigatie jos */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;
  font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:var(--accent)}

/* card "urmatorul episod" */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;background:var(--panel);
  border-radius:16px;padding:10px 12px 10px 10px}
.card .thumb{width:62px;aspect-ratio:2/3;border-radius:9px;overflow:hidden;background:var(--panel2)}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.info{display:flex;flex-direction:column;min-width:0}
.info b{font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;font-size:15px}
.epname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{color:var(--muted);font-size:13px}
.check{width:50px;height:50px;border-radius:50%;border:2.5px solid var(--accent);color:var(--accent);
  display:grid;place-items:center;transition:background .15s,transform .15s}
.check svg{width:24px;height:24px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.check:active{transform:scale(.92)}
.check.on{background:var(--accent);color:var(--accent-ink)}
.date{min-width:62px;text-align:center;font-weight:800;line-height:1.1;color:var(--ok)}
.date small{display:block;font-weight:500;color:var(--muted);font-size:12px}

/* grila de postere cu banda de progres */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px}
.pcard{display:flex;flex-direction:column;gap:5px;min-width:0}
.pimg{position:relative;aspect-ratio:2/3;border-radius:11px;overflow:hidden;background:var(--panel2);
  display:grid;place-items:center;text-align:center;padding:0;font-weight:700;font-size:14px;color:var(--muted)}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pimg > span{padding:8px}
.tape{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--shade)}
.tape div{height:100%;background:var(--accent)}
.badge{position:absolute;top:6px;right:6px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;
  background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;line-height:26px;font-style:normal;text-align:center}
.pcard b{font-size:14px;font-weight:650;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard small{font-size:12.5px;color:var(--muted);margin-top:-3px}

/* chips / segmente */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--panel);font-weight:600;font-size:14.5px;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg)}
.chip .n{opacity:.65;margin-left:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:9px 13px;border-radius:12px;background:var(--panel);font-weight:600;font-size:14.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* cautare */
.searchbox input{width:100%;font:inherit;font-size:17px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);outline:none}
.searchbox input:focus{border-color:var(--accent)}
.result{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.result .thumb{width:56px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--panel2)}
.result .thumb img{width:100%;height:100%;object-fit:cover}
.result p{margin:2px 0 0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{padding:9px 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14.5px;white-space:nowrap}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger);padding-left:0}
.tag{font-size:13px;font-weight:650;color:var(--ok);white-space:nowrap}

/* pagina de detaliu */
.hero{position:relative;margin:0 -16px;padding:56px 16px 0;background:var(--bd) center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 35%,transparent),var(--bg) 92%)}
.hero .in{position:relative;display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:end}
.hero .poster{width:112px;aspect-ratio:2/3;border-radius:12px;object-fit:cover;background:var(--panel2);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hero h1{margin:0 0 6px;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.025em;font-variation-settings:"opsz" 96}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;color:var(--muted)}
.facts .live{color:var(--ok);font-weight:650}
.block{background:var(--panel);border-radius:16px;padding:14px;margin-top:14px}
.prog{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.prog .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:8px}
.bar div{height:100%;background:var(--accent);border-radius:4px}
.nextrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.overview{color:var(--muted);font-size:15px;line-height:1.55;margin:14px 0 0;max-width:68ch}
.stars{display:flex;gap:2px}
.stars button{font-size:28px;line-height:1;color:var(--line);padding:2px}
.stars button.on{color:var(--accent)}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* sezoane si episoade */
.season{background:var(--panel);border-radius:14px;margin-top:10px;overflow:hidden}
.shead{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:13px 14px}
.shead .t{font-weight:700;text-align:left}
.shead .c{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.shead .c.full{color:var(--ok);font-weight:700}
.sall{font-size:13px;font-weight:700;color:var(--accent);padding:6px 8px;border-radius:8px;background:var(--panel2)}
.eps{border-top:1px solid var(--line)}
.ep{display:grid;grid-template-columns:30px 1fr 42px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.ep:last-child{border-bottom:0}
.ep .num{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.ep b{font-weight:600;font-size:15px;display:block}
.ep small{color:var(--muted);font-size:12.5px}
.ep .upto{font-size:12.5px;color:var(--accent);font-weight:600;margin-left:8px}
.ep.future{opacity:.5}
.ep.done .num{color:var(--ok)}
.tick{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.tick svg{width:18px;height:18px;stroke:currentColor;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ep.done .tick{background:var(--ok);border-color:var(--ok);color:var(--bg)}

/* statistici */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border-radius:16px;padding:14px}
.stat .v{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.stat .l{color:var(--muted);font-size:13.5px;margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:5px;height:130px;background:var(--panel);border-radius:16px;padding:14px 12px 30px;position:relative}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.chart .col i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.chart .col span{position:absolute;bottom:-20px;font-size:11px;color:var(--muted)}
.chart .col em{font-style:normal;font-size:11px;color:var(--muted);margin-bottom:3px}
.toprow{display:grid;grid-template-columns:24px 40px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.toprow img,.toprow .ph{width:40px;aspect-ratio:2/3;border-radius:6px;object-fit:cover;background:var(--panel2)}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:19px;margin-bottom:6px}
.empty .btn{display:inline-block;margin-top:16px}
.err{background:var(--panel);border-left:4px solid var(--danger);border-radius:12px;padding:14px 16px;margin-top:20px}
.err b{display:block;margin-bottom:4px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  pointer-events:none;transition:.2s;background:var(--text);color:var(--bg);border-radius:14px;padding:11px 16px;
  display:flex;gap:16px;align-items:center;font-weight:600;font-size:14.5px;z-index:9;width:max-content;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--accent);font-weight:800}
:root[data-theme=light] #toast button{color:#F4C152}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* --- adaugiri Watch Time --- */
.tabs a{font-size:10.5px}
.tabs svg{width:23px;height:23px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:116px;gap:12px;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row > *{scroll-snap-align:start}
.dcard{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0}
.dcard .pimg{display:grid}
.qadd{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.65);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.qadd svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.qadd.in{background:var(--ok);color:#0B1A16}
.score{position:absolute;left:6px;bottom:6px;font-size:12px;font-weight:800;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.65);color:#F4C152}
.dcard b{font-size:14px;font-weight:650;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard small{font-size:12.5px;color:var(--muted);margin-top:-3px}
.toggle{display:inline-flex;background:var(--panel);border-radius:14px;padding:4px;margin:4px 0 12px}
.toggle button{padding:9px 20px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted)}
.toggle button.on{background:var(--accent);color:var(--accent-ink)}
.more{display:block;margin:18px auto 0}
.rw{display:inline-block;font-size:11.5px;font-weight:800;color:var(--bg);background:var(--ok);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.xcount{font-weight:800;color:var(--ok);margin-left:6px}
.rwbox{border:2px solid var(--ok)}
.rwbox .bar div{background:var(--ok)}

/* Seriale: taburi, numaratoare, istoric */
.tabs3{display:flex;width:100%;margin:0}
.tabs3 button{flex:1;padding:10px 4px;font-size:14px;white-space:nowrap}
.tabs3 .n{margin-left:5px;opacity:.7;font-weight:600}
.link{color:var(--accent);font-weight:650;font-size:14px}
.rw.new{background:var(--accent);color:var(--accent-ink)}
.days{min-width:62px;text-align:center;line-height:1}
.days b{display:block;font-size:30px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.days b.w{font-size:17px;color:var(--ok)}
.days small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
#anchor{min-height:100vh}
.hist{opacity:.9}
.hrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.hrow .thumb{width:40px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--panel2)}
.hrow .thumb img{width:100%;height:100%;object-fit:cover}
.hrow b{font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .info span{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .code{font-size:13.5px}
.hint{display:block;width:100%;text-align:center;color:var(--muted);font-size:12.5px;padding:6px 0 4px}

/* randuri Discover cu sageti pe desktop */
.rowwrap{position:relative}
.rarr{display:none}
@media (hover:hover) and (pointer:fine){
  .rarr{display:grid;place-items:center;position:absolute;top:calc(50% - 44px);z-index:2;width:46px;height:46px;border-radius:50%;
    background:var(--accent);color:var(--accent-ink);font-size:30px;font-weight:800;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.5);opacity:.85;transition:opacity .15s,transform .15s}
  .rarr:hover{opacity:1;transform:scale(1.08)}
  .rarr.l{left:-10px}.rarr.r{right:-10px}
  .row,.chips{scrollbar-width:thin;cursor:grab}
  .row::-webkit-scrollbar,.chips::-webkit-scrollbar{display:block;height:6px}
  .row::-webkit-scrollbar-thumb,.chips::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}
  .dragging a,.dragging img{pointer-events:none}
}
.rowline h2{margin-bottom:12px}
.qadd.watch{background:rgba(0,0,0,.65);color:#fff;border:2px solid rgba(255,255,255,.75)}
.qadd.watch.in{background:var(--done);border-color:var(--done);color:#062611}
.lists2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:420px){.lists2{grid-template-columns:1fr}}
.cathead{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.catrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-weight:600}
.cnt{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700}
.chev{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--panel2);color:var(--accent)}
.chev svg{width:15px;height:15px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.catrow:hover .chev,.cathead:hover .chev{background:var(--accent);color:var(--accent-ink)}
#ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translate(-50%,-60px);z-index:30;background:var(--panel);
  color:var(--text);padding:8px 14px;border-radius:18px;font-size:13.5px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;pointer-events:none}
#ptr.show{opacity:1}

.infs{display:flex;align-items:center;justify-content:center;gap:10px;padding:22px 0 8px;color:var(--muted);font-weight:600;font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin:2px 0 14px}
.tools input,.tools select{font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none;min-width:0}
.tools input:focus,.tools select:focus{border-color:var(--accent)}
.tools select{max-width:48vw}
.chips.sticky{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);margin:0 -16px;padding:8px 16px 10px;
  box-shadow:0 8px 12px -10px rgba(0,0,0,.5)}

.subbar{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);margin:0 -16px;padding:6px 16px 8px;
  transition:transform .22s ease;box-shadow:0 8px 12px -10px rgba(0,0,0,.5)}
.subbar .toggle{margin:0}
.subbar .chips{padding-bottom:2px;margin-top:8px}
.subbar.hid{transform:translateY(calc(-100% - 70px))}

.eplink{color:inherit}
.eplink:hover b{color:var(--accent)}
.ephero{padding-top:130px}
.ephero .in1{position:relative;padding-bottom:4px}
.ephero h1{margin:4px 0 6px;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.epnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}

.herobtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.webbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px 8px 10px}

.seentag{position:absolute;top:6px;left:6px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 5px;border-radius:9px;
  background:var(--ok);color:#0B1A16;font-size:12px;font-weight:800}
.seentag svg{width:14px;height:14px;stroke:currentColor;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.badge.left{right:auto;left:6px}

.card .thumb{position:relative}
.card .thumb .tape{height:5px}

.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}

.sunbtn{display:block;width:100%;margin-top:6px;padding:9px;border-radius:12px;background:var(--panel2);font-weight:600;font-size:14.5px}

.sunpanel{margin-top:10px;padding:12px;border-radius:12px;background:var(--panel2)}
.sunpanel .btn.ghost{background:var(--panel)}
.sunrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sunrow:first-of-type{margin-top:8px}
.sunrow select,.sunrow input{font:inherit;font-size:14.5px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.sunpanel > small{display:block;margin-top:8px}

.chk{display:flex;align-items:center;gap:10px;padding:7px 0;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.notewarn{margin:0;padding:10px 12px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--accent);font-size:14px}

.imdb{display:inline-flex;align-items:center;gap:6px;padding:0 4px;height:36px;color:var(--text);text-decoration:none}
.imdblogo{display:inline-block;background:#F5C518;color:#000;font:900 12.5px/1 Arial,Helvetica,sans-serif;letter-spacing:-.2px;padding:4px 5px;border-radius:4px}
.imdb b{font-size:15px;font-weight:800}
.imdb .of{font-size:12.5px;color:var(--muted);margin-left:-4px}

.imdbmini{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:12.5px;font-weight:800;color:var(--text);vertical-align:1px}
.imdbmini .imdblogo{font-size:9.5px;padding:2px 3px;border-radius:3px}

.tape .done,.bar .done{background:var(--done)!important}
.tape .upd,.bar .upd{background:var(--more)!important}
.tape .rwb,.bar .rwb{background:var(--ok)!important}

.imdbcar{grid-auto-columns:100%;gap:0;margin:0;padding:0;scroll-snap-type:x mandatory}
.imdbcar .slide{scroll-snap-align:start;background:var(--panel);border-radius:16px;padding:12px 10px 8px;margin:0 2px}
.slidehead{display:flex;justify-content:space-between;align-items:center;padding:0 4px 4px;font-size:14px}
.slidehead > b{font-size:17px}
.slidehead .imdblogo{font-size:10px;padding:2px 4px;vertical-align:1px}
.slidefoot{text-align:center;font-size:12px;color:var(--muted);margin-top:-2px}
.imdbsvg{width:100%;height:auto;display:block}
.imdbsvg .g{stroke:var(--line);stroke-width:1}
.imdbsvg .avg{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.imdbsvg .ln{fill:none;stroke:var(--text);stroke-width:2;opacity:.55}
.imdbsvg .ax{fill:var(--muted);font-size:11px}
.imdbsvg .val{fill:var(--text);font-size:10.5px;font-weight:700}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.dots button{min-width:28px;height:28px;border-radius:14px;background:var(--panel2);color:var(--muted);font-size:12.5px;font-weight:700}
.dots button.on{background:var(--accent);color:var(--accent-ink)}

.clrwrap{position:relative;display:block;min-width:0}
.clrwrap input{width:100%;padding-right:40px!important}
.clrbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;
  background:var(--panel2);color:var(--muted);display:none;place-items:center}
.clrbtn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.clrwrap.has .clrbtn{display:grid}
.clrbtn:active{background:var(--accent);color:var(--accent-ink)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}

#bell{margin-left:auto;position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--text)}
#bell svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
#bell:active{background:var(--panel2)}
#bellcount{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#E5484D;color:#fff;
  font-style:normal;font-size:11px;font-weight:800;line-height:18px;text-align:center}
.nlist{display:flex;flex-direction:column;gap:8px}
.nrow{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border-radius:14px;padding:9px 12px 9px 9px}
.nrow .thumb{width:48px;aspect-ratio:2/3;border-radius:7px;overflow:hidden;background:var(--panel2)}
.nrow .thumb img{width:100%;height:100%;object-fit:cover}
.nrow .info b{font-size:15px}
.nrow .info span{font-size:14px;color:var(--text);opacity:.85}
.nrow .info small{margin-top:2px}
.nrow:not(.unread){opacity:.62}
.udot{width:10px;height:10px;border-radius:50%;background:var(--accent)}

.nbtns{display:flex;gap:8px;margin:4px 0 14px}
.nbtns .btn{flex:1;padding:10px 8px;font-size:14px}
.nbtns .btn.danger{background:var(--panel2);padding-left:8px}
.nbtns .btn:disabled{opacity:.45}

.disctop{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:4px 0 0}
.disctop .toggle{margin:0}
#dsort{font:inherit;font-size:14.5px;font-weight:600;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);min-width:0;max-width:52%}

.qadd.st-y,.stchk.st-y{background:#F4C152;color:#241A00}
.qadd.st-g,.stchk.st-g{background:var(--done);color:#062611}
.qadd.st-t,.stchk.st-t{background:var(--ok);color:#0B1A16}
.qadd.st-s,.stchk.st-s{background:#6E6E76;color:#fff}
.stchk{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;z-index:1;box-shadow:0 2px 6px rgba(0,0,0,.35)}

.ugh{font-size:16px;font-weight:750;margin:18px 0 10px;color:var(--text)}
.ugh .n{color:var(--muted);font-weight:500;margin-left:6px}

.ntlabel{font-size:13.5px;font-weight:700;color:var(--muted);margin:0 0 6px}
.ntimes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.ntrow{display:flex;align-items:center;gap:4px;background:var(--panel2);border-radius:12px;padding:4px 4px 4px 6px}
.ntrow input{width:auto!important;border:0!important;background:transparent!important;padding:6px!important}
.ntdel{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ntdel svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.ntdef{margin:0;padding:10px 12px;border-radius:12px;background:var(--panel2);font-weight:600;font-size:14.5px;width:100%}

.sheet{width:100%;max-width:520px;background:var(--panel);border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet p{margin:0 0 8px;color:var(--muted);font-size:14px}
.sheet button{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;background:var(--panel2);margin-top:8px;font-weight:700}
.sheet button.pri{background:var(--accent);color:var(--accent-ink)}
.sheet button.dan{color:var(--danger)}

.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.authbox{width:100%;max-width:360px}

.authbox p{color:var(--muted);margin:6px 0 22px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13.5px;font-weight:650;color:var(--muted);margin-bottom:5px}
.field input{width:100%;font:inherit;font-size:17px;padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none}
.field input:focus{border-color:var(--accent)}
.authbox .btn{width:100%;padding:14px;font-size:16px;margin-top:6px}
.formerr{color:var(--danger);font-weight:600;min-height:22px;margin-top:10px;font-size:14.5px}
.urow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.urow small{display:block;color:var(--muted);font-size:12.5px}
.inline{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}
.inline input{min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none}
.who{display:flex;align-items:center;gap:12px;margin-top:6px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:21px}

function getLang(){
  if(state.me?.lang) return state.me.lang;
  try { const l = localStorage.getItem('wt-lang'); if(l) return l; } catch {}
  return (navigator.language || '').toLowerCase().startsWith('ro') ? 'ro' : 'en';
}
function t(key, ...a){ const v = I18N[getLang()][key] ?? I18N.ro[key]; return typeof v === 'function' ? v(...a) : v; }
window.setLang = async l => {
  try { localStorage.setItem('wt-lang', l); } catch {}
  if(state.me){ state.me.lang = l; try { await api('lang', {lang:l}); } catch {} buildNav(); state.disc.data = {}; softRefresh(); }
  else boot();
  applyLang();
};
function applyLang(){ document.documentElement.lang = getLang(); $('#back').textContent = t('back'); }
function langSwitch(){
  const L = getLang();
  return `<div class="seg" role="group" aria-label="Language">${[['ro','Română'],['en','English']].map(([k, l]) =>
    `<button type="button" class="${L === k ? 'on' : ''}" onclick="setLang('${k}')">${l}</button>`).join('')}</div>`;
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img = (p, size='w342') => p ? `https://image.tmdb.org/t/p/${size}${p}` : '';

function netError(){ const e = new Error(t('noServer')); e.code = 'network'; return e; }
async function fetchT(url, opts = {}, ms = 15000){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, {...opts, signal:ctl.signal}); }
  catch { throw netError(); }
  finally { clearTimeout(tm); }
}
async function api(path, body){
  const r = await fetchT('/api/' + path, body
      ? {method:'POST', headers:{'Content-Type':'application/json', ...H()}, body:JSON.stringify(body), credentials:'same-origin'}
      : {cache:'no-store', credentials:'same-origin', headers:H()},
    path === 'import' && body ? 120000 : 15000);
  let j = {}; try { j = await r.json(); } catch { if(!r.ok || r.status === 0) throw netError(); }
  if(r.status === 401 || j.code === 'admin_wifi'){ boot(); throw new Error(j.error || t('loginIntro')); }
  if(!r.ok){ const e = new Error(j.error || t('serverSaid', r.status)); e.code = j.code; throw e; }
  return j;
}
function fmtDate(d, rel){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00'), n = new Date(); n.setHours(0,0,0,0);
  const diff = Math.round((dt - n) / 864e5);

const THEME_BG = {dark:'#000000', grey:'#1E1F22', light:'#E9ECF4'};
/* ---------- tema dupa ora zilei (rasarit / apus calculate local) ---------- */
function sunTimes(date, lat, lng){
  const rad = Math.PI / 180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397, J0 = 0.0009;
  const toDays = d => d.valueOf() / dayMs - 0.5 + J1970 - J2000, fromJ = j => new Date((j + 0.5 - J1970) * dayMs);
  const lw = rad * -lng, phi = rad * lat, d = toDays(date);
  const n = Math.round(d - J0 - lw / (2 * Math.PI));
  const ds = J0 + lw / (2 * Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028 * ds);
  const L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  if(isNaN(w)) return null;                                   // zi/noapte polara
  const Jset = J2000 + J0 + (w + lw) / (2 * Math.PI) + n + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  return {rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset)};
}
const SCHED_DEF = {t1:'11:00', t2:'15:00', night:'dark', morning:'dark', midday:'light', afternoon:'grey', lat:null, lon:null};

  const c = getSched(), now = new Date();
  const st = c.lat != null ? sunTimes(now, c.lat, c.lon) : null;
  if(st) return {...st, real:true};
  const at = hm => { const d = new Date(now); d.setHours(hm, 0, 0, 0); return d; };
  return {rise:at(7), set:at(19), real:false};                  // fara locatie: 07:00 / 19:00
}

  if(now < rise || now >= set) return c.night;
  if(now < at(c.t1)) return c.morning;
  if(now < at(c.t2)) return c.midday;

  const allowed = state.me.is_admin ? ADMIN_TABS : [...USER_TABS, 'tv', 'movie', 'library', 'lists', 'ep', 'notifs'];

  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.dataset.v === (['library', 'ep', 'tv'].includes(name) ? 'shows' : name === 'notifs' ? ''  : name === 'lists' ? 'profile' : name)));

  try {
    const html = await views[name](arg);

    if(restore != null){ quietUntil = Date.now() + 800; scrollTo(0, restore); }

    else if(soft) scrollTo(0, y);

  }
}

  year_new:(a, b) => (b.year || '').localeCompare(a.year || '') || a.title.localeCompare(b.title),

  progress:(a, b) => (b.aired ? b.watched / b.aired : 0) - (a.aired ? a.watched / a.aired : 0) || a.title.localeCompare(b.title),

function listTools(key, sorts, items, render, opt = {}){
  let pref = {}; try { pref = JSON.parse(localStorage.getItem('wt-sort') || '{}'); } catch {}
  const st = LT[key] || (LT[key] = {q:'', sort: sorts.includes(pref[key]) ? pref[key] : sorts[0]});
  if(!sorts.includes(st.sort)) st.sort = sorts[0];
  const qs = opt.qKey ? (LT[opt.qKey] || (LT[opt.qKey] = {q:''})) : st;
  LT.current = {key, items, render, sorts, all:opt.all, renderAll:opt.renderAll, qs};

    <div id="lbody">${toolsBody()}</div>`;
}
function toolsBody(){
  const c = LT.current, st = LT[c.key], q = fold(c.qs.q);

  const rows = (wide ? c.all : c.items).filter(i => !q || fold(i.title).includes(q)).sort(SORTERS[st.sort]);

/* ---------- grafic note IMDb pe sezoane ---------- */
function rateColor(r){ return r >= 9 ? '#2FBF71' : r >= 8 ? '#8BCB4A' : r >= 7 ? '#F4C152' : r >= 6 ? '#F08A3E' : '#E5484D'; }
function seasonSvg(se){
  const eps = se.eps, n = eps.length, W = 340, H = 190, L = 40, R = 16, T = 26, B = 26;
  const lo = Math.max(1, Math.floor(Math.min(...eps.map(e => e.r)) - 0.5)), hi = 10;
  const x = i => n === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (n - 1);
  const y = r => T + (hi - r) * (H - T - B) / (hi - lo);
  const grid = [];
  for(let v = hi; v >= lo; v -= (hi - lo > 4 ? 2 : 1)) grid.push(v);
  const every = n > 16 ? 2 : 1, labels = n <= 14;
  const path = eps.map((e, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(e.r).toFixed(1)}`).join(' ');
  const avgY = y(se.avg);
  return `<svg viewBox="0 0 ${W} ${H}" class="imdbsvg" role="img" aria-label="${esc(t('season', se.n))}">
    ${grid.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="g"/><text x="${L - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v}</text>`).join('')}
    <line x1="${L}" x2="${W - R}" y1="${avgY}" y2="${avgY}" class="avg"/>
    <path d="${path}" class="ln"/>
    ${eps.map((e, i) => `<circle cx="${x(i)}" cy="${y(e.r)}" r="${n > 20 ? 3.2 : 4.5}" fill="${rateColor(e.r)}"><title>E${e.e}: ${e.r}</title></circle>
      ${labels ? `<text x="${x(i)}" y="${y(e.r) - 9}" class="val" text-anchor="middle">${e.r.toFixed(1)}</text>` : ''}
      ${i % every === 0 ? `<text x="${x(i)}" y="${H - 8}" class="ax" text-anchor="middle">${e.e}</text>` : ''}`).join('')}
  </svg>`;
}
function imdbChartHtml(r){
  if(!r || !r.seasons || !r.seasons.length)
    return r && r.state === 'pending' ? `<h2>${t('imdbChart')}</h2><p class="muted">${t('imdbPending')}</p>` : '';

        : d.seen_all ? `<div class="nextrow"><span class="muted">${t('seenAll', d.total_plays > d.aired ? d.total_plays - d.aired : 0)}</span><button class="btn" onclick="T.rewatch(${id})">${t('startRewatch')}</button></div>` : ''}

  async ep(arg){
    setTop('', true);
    const [id, sn, en] = (arg || '').split('-').map(Number);

      <a class="link" href="#/tv/${id}">${esc(d.title)} ›</a>

      <h1>${esc(e.name)}</h1>
      <div class="facts">${e.air_date ? `<span class="${e.aired ? '' : 'live'}">${e.aired ? fmtDate(e.air_date) : t('comingOut', fmtDate(e.air_date))}</span>` : ''}${e.runtime ? `<span>${e.runtime} min</span>` : ''}</div>
      ${e.imdb ? `<div class="herobtns">${imdbBadge(e.imdb)}</div>` : ''}</div></section>`;
    if(e.aired){
      h += `<div class="block">` + (e.done
        ? `<div class="rowline"><div class="info"><b style="color:var(--ok)">✓ ${t('watchedTimes', e.count)}</b></div>
             <button class="btn" onclick="T.epAct('play',${id},${sn},${en},${e.runtime || 'null'})">${t('watchedAgain')}</button></div>
           <button class="btn danger" style="margin-top:8px" onclick="T.epAct('unplay',${id},${sn},${en})">${t('removePlay')}</button>`
        : `<button class="btn" style="width:100%;padding:14px;font-size:16px" onclick="T.epAct('play',${id},${sn},${en},${e.runtime || 'null'})">${t('markWatched')}</button>
           ${en > 1 || sn > 1 ? `<button class="btn ghost" style="width:100%;margin-top:8px" onclick="T.upto(${id},${sn},${en})">${t('markUpto')}</button>` : ''}`) + `</div>`;
    } else h += `<div class="block rowline"><span class="muted">${t('notAiredYet')}</span>${countdown(e.air_date)}</div>`;
    h += `<p class="overview">${esc(e.overview || t('noOverview'))}</p>`;
    h += `<div class="epnav">${prev ? `<a class="btn ghost" href="#/ep/${id}-${sn}-${prev.episode}">‹ ${code(prev)}</a>` : '<span></span>'}
      ${next ? `<a class="btn ghost" href="#/ep/${id}-${sn}-${next.episode}">${code(next)} ›</a>` : '<span></span>'}</div>`;
    return h;

    if(imp.state === 'running') setTimeout(pollImport, 1000);
    return `<div class="who"><div class="avatar">${esc(me.username[0].toUpperCase())}</div><div><b style="font-size:19px">${esc(me.username)}</b>
      <small class="muted" style="display:block">${t('user')}</small></div></div>
      <h2>${t('stats')}</h2><div class="statgrid">
        <div class="stat"><div class="v">${dur(s.tv_minutes)}</div><div class="l">${t('onShows')}</div></div>
        <div class="stat"><div class="v">${s.episodes}</div><div class="l">${t('epsWatched')}${s.rewatched_eps ? t('rewatchedN', s.rewatched_eps) : ''}</div></div>
        <div class="stat"><div class="v">${dur(s.movie_minutes)}</div><div class="l">${t('onMovies')}</div></div>
        <div class="stat"><div class="v">${s.movies}</div><div class="l">${t('moviePlays')}</div></div>
      </div>
      <h2>${t('perMonth')}</h2>
      <div class="chart">${s.months.map(m => `<div class="col">${m.count ? `<em>${m.count}</em>` : ''}<i style="height:${m.count / max * 100}%"></i><span>${t('months')[+m.month.slice(5) - 1]}</span></div>`).join('')}</div>
      ${s.top.length ? `<h2>${t('mostWatched')}</h2>` + s.top.map((r, i) => `<a class="toprow" href="#/tv/${r.id}"><span class="muted">${i + 1}</span>
        ${r.poster ? `<img src="${img(r.poster, 'w92')}" alt="">` : '<div class="ph"></div>'}<b>${esc(r.title)}</b><span class="muted">${r.c} ep.</span></a>`).join('') : ''}
      ${listsBlock}
      <h2>${t('settingsH')}</h2><div class="block">${themeRow()}${pwForm()}
      <div class="rowline" style="margin-top:16px"><span>${t('backup')}</span><a class="btn ghost" href="/api/export">${t('download')}</a></div>
      </div><h2>${t('notifH')}</h2><div class="block" id="pushblock"><p class="muted" style="margin:0">${t('loading')}</p></div>${importBlock}
      <div class="rowline" style="margin-top:18px"><span></span><button class="btn danger" onclick="T.logout()">${t('logout')}</button></div>`;

  async users(){

  async settings(){

      <h2>${t('tmdbH')}</h2><div class="block">

        <p class="muted" style="margin:-4px 0 12px;font-size:13.5px">${t('serverTime', c.server_time.replace('T', ' '))}</p>
        <button type="button" class="btn ghost" onclick="act(() => api('admin/notify-now', {}), t('notifChecking'))">${t('notifCheckNow')}</button></div>
      <h2>${t('security')}</h2><div class="block">
        <label class="field"><span>${t('homeNets')}</span>
          <textarea name="lan_networks" rows="4" style="${box};font-size:15px">${esc(c.lan_networks.join('\n'))}</textarea></label>
        <label class="field"><span>${t('sessionDays')}</span><input name="session_days" type="number" min="1" max="3650" value="${c.session_days}"></label>
        <label class="field"><span>${t('maxFails')}</span><input name="max_login_fails" type="number" min="3" max="100" value="${c.max_login_fails}"></label>

      <button class="btn" style="width:100%;margin-top:14px;padding:14px">${t('saveSettings')}</button></form>
      <h2>${t('myAccount')}</h2><div class="block">${themeRow()}${pwForm()}

  async system(){
    setTop(t('tabs').system);
    const s = await api('admin/system');
    const mb = (s.db_bytes / 1048576).toFixed(1);

    return `<div class="statgrid" style="margin-top:8px">
        <div class="stat"><div class="v">${s.users}</div><div class="l">${t('sysUsers')}</div></div>
        <div class="stat"><div class="v">${s.items}</div><div class="l">${t('sysItems')}</div></div>
        <div class="stat"><div class="v">${s.plays}</div><div class="l">${t('sysPlays')}</div></div>
        <div class="stat"><div class="v">${mb} MB</div><div class="l">${t('sysDb')}</div></div>
        <div class="stat"><div class="v">${up}</div><div class="l">${t('sysUptime')}</div></div>
        <div class="stat"><div class="v">${s.cache}</div><div class="l">${t('sysCache')}</div></div>
      </div>
      <h2>${t('maintenance')}</h2><div class="block">
        <div class="rowline"><div><b>${t('fullBackup')}</b><small class="muted" style="display:block">${t('fullBackupText')}</small></div>
          <a class="btn" href="/api/admin/backup">${t('download')}</a></div>
        <div class="rowline" style="margin-top:16px"><div><b>${t('clearCache')}</b><small class="muted" style="display:block">${t('clearCacheText')}</small></div>
          <button class="btn ghost" onclick="act(() => api('admin/cache-clear', {}), t('cacheCleared'))">${t('clear')}</button></div></div>

async function pollImport(){
  const el = $('#impstat'); if(!el) return;
  try {
    const j = await api('import');
    if(j.state === 'running'){ el.textContent = t('importing', j.done, j.total); setTimeout(pollImport, 1000); }
    else if(j.state === 'done'){ el.textContent = t('importDone', j.result); toast(t('importDone', j.result)); }
  } catch(e){ el.textContent = e.message; }
}
/* ---------- notificari ---------- */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
function keyBytes(b64){ const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, c => c.charCodeAt(0)); }
async function pushReg(){ return navigator.serviceWorker.register('/sw.js').then(() => navigator.serviceWorker.ready); }
async function renderPush(){
  const box = $('#pushblock'); if(!box) return;
  let p; try { p = await api('push'); } catch(e){ box.innerHTML = errorBox(e); return; }
  const info = `<p class="muted" style="margin:0 0 12px;font-size:14px">${t('notifInfo2')}</p>
    <div class="ntlabel">${t('pushWhen')}</div>
    <div class="ntimes" id="ntimes">${p.times.length ? p.times.map(timeRow).join('') : `<p class="ntdef">${t('pushHourly')}</p>`}</div>
    <button class="btn ghost ntadd" onclick="addPushTime()">＋ ${t('pushAdd')}</button>`;
  const prefs = `<label class="chk"><input type="checkbox" ${p.eps ? 'checked' : ''} onchange="pushPrefs()" id="pp_eps"> ${t('notifEps')}</label>
    <label class="chk"><input type="checkbox" ${p.movies ? 'checked' : ''} onchange="pushPrefs()" id="pp_mv"> ${t('notifMovies')}</label>
    <label class="field" style="margin:10px 0 0"><span>${t('notifFormat')}</span>
      <select id="pp_fmt" onchange="pushPrefs()" style="width:100%;font:inherit;font-size:15px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text)">
      ${[2, 1, 0].map(k => `<option value="${k}" ${p.fmt === k ? 'selected' : ''}>${t('notifFmt' + k)}</option>`).join('')}</select></label>`;
  let why = '';
  if(!p.available) why = t('notifServerOff');
  else if(!window.isSecureContext) why = t('notifHttps');
  else if(isIOS && !isStandalone()) why = t('notifIosHome');
  else if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) why = t('notifUnsupported');
  if(why){ box.innerHTML = info + `<p class="notewarn">${why}</p>` + (p.devices ? `<p class="muted" style="margin:10px 0 0">${t('notifOther', p.devices)}</p>` : ''); return; }
  let sub = null;
  try { sub = await (await pushReg()).pushManager.getSubscription(); } catch {}
  if(sub) api('push/subscribe', {sub:sub.toJSON(), device:navigator.userAgent}).catch(() => {});   // resincronizare tacuta
  const denied = Notification.permission === 'denied';
  box.innerHTML = info + (sub
    ? `<p style="margin:0 0 10px;font-weight:700;color:var(--ok)">✓ ${t('notifOn')}</p>${prefs}
       <div class="rowline" style="margin-top:12px"><button class="btn ghost" onclick="pushTest()">${t('notifTest')}</button>
       <button class="btn danger" onclick="pushOff()">${t('notifOff')}</button></div>`
    : denied ? `<p class="notewarn">${t('notifDenied')}</p>`
    : `<button class="btn" style="width:100%;padding:13px" onclick="pushOn(this)">${t('notifEnable')}</button>${p.devices ? `<p class="muted" style="margin:10px 0 0">${t('notifOther', p.devices)}</p>` : ''}`)
    + `<p class="muted" id="pushmsg" style="margin:10px 0 0"></p>`;
  window._pushKey = p.key;
}
window.pushOn = async btn => {
  btn.disabled = true;
  const perm = await Notification.requestPermission();      // trebuie sa fie primul pas dupa atingere (iPhone)
  if(perm !== 'granted'){ btn.disabled = false; $('#pushmsg').textContent = t('notifDenied'); return; }
  try {
    const reg = await pushReg();
    const old = await reg.pushManager.getSubscription(); if(old) await old.unsubscribe();
    const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:keyBytes(window._pushKey)});
    await api('push/subscribe', {sub:sub.toJSON(), device:navigator.userAgent});
    toast(t('notifOnToast')); renderPush();
  } catch(e){ btn.disabled = false; $('#pushmsg').textContent = e.message || String(e); }
};
window.pushOff = async () => {
  try { const reg = await pushReg(); const sub = await reg.pushManager.getSubscription();
    if(sub){ await api('push/unsubscribe', {endpoint:sub.endpoint}); await sub.unsubscribe(); } } catch {}
  renderPush();
};
function timeRow(v){
  return `<div class="ntrow"><input type="time" value="${v}" onchange="pushTimes()">
    <button class="ntdel" aria-label="${t('remove')}" onclick="this.parentNode.remove();pushTimes()"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>`;
}
window.addPushTime = () => {
  const box = $('#ntimes'); box.querySelector('.ntdef')?.remove();
  const used = [...box.querySelectorAll('input')].map(i => i.value);
  const next = ['09:00', '12:00', '18:00', '21:00', '07:00', '15:00'].find(v => !used.includes(v)) || '20:00';
  box.insertAdjacentHTML('beforeend', timeRow(next)); pushTimes();
};
window.pushTimes = async () => {
  try {
    const times = [...document.querySelectorAll('#ntimes input')].map(i => i.value).filter(Boolean);
    const r = await api('push/times', {times});
    toast(r.times.length ? t('pushAt', r.times.join(', ')) : t('pushHourlyToast'));
    if(!r.times.length) $('#ntimes').innerHTML = `<p class="ntdef">${t('pushHourly')}</p>`;
  } catch(e){ toast(e.message); }
};
window.pushTest = () => act(() => api('push/test', {}), t('notifTestSent'));
window.pushPrefs = () => api('push/prefs', {eps:$('#pp_eps').checked, movies:$('#pp_mv').checked, fmt:+$('#pp_fmt').value}).catch(e => toast(e.message));
afterRender.profile = () => { afterRender.profile_forms(); renderPush(); };
afterRender.settings = afterRender.profile_forms = () => {
  const fi = $('#impfile');
  if(fi) fi.onchange = () => {
    const f = fi.files[0]; if(!f) return;
    const el = $('#impstat'); el.textContent = t('readingFile');
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const j = await api('import', {name:f.name, data:String(rd.result).split(',')[1] || ''});
        el.textContent = t('importing', j.done, j.total); setTimeout(pollImport, 1000);
      } catch(e){ el.textContent = e.message; }
      fi.value = '';
    };
    rd.readAsDataURL(f);
  };
  const pf = $('#pwform');
  if(pf) pf.onsubmit = ev => { ev.preventDefault(); const f = Object.fromEntries(new FormData(pf));
    act(() => api('password', f), t('pwChanged')); };
  const sf = $('#setform');
  if(sf) sf.onsubmit = ev => { ev.preventDefault(); const f = Object.fromEntries(new FormData(sf));
    act(() => api('admin/settings', {tmdb_key:f.tmdb_key, language:f.language, lan_networks:f.lan_networks.split('\n'),
      session_days:+f.session_days, max_login_fails:+f.max_login_fails,
      timezone:f.timezone}), t('settingsSaved')); };
};
afterRender.movies = bindTools;
afterRender.lists = bindTools;
afterRender.discover = () => {
  infinite(async () => {
    const D = state.disc, r = await api(discQuery(D.page + 1));
    D.results.push(...r.results); D.page = r.page; D.pages = r.total_pages;
    return {html: r.results.map(discCard).join(''), more: D.page < D.pages};
  });
};
afterRender.users = () => {
  const nu = $('#newuser');
  if(nu) nu.onsubmit = ev => { ev.preventDefault(); const f = Object.fromEntries(new FormData(nu));
    act(() => api('admin/users/create', {username:f.username, password:f.password, is_admin:!!f.is_admin}), t('accountCreated', f.username)); };
};
window.userMenu = (id, name, self) => sheet(name, self ? t('selfAdmin') : t('whatToDo'), [
  {label:t('changePw'), fn:() => { const p = prompt(t('newPwFor', name)); if(p) act(() => api('admin/users/password', {id, password:p}), t('pwChanged')); }},
  {label:t('rename'), fn:() => { const n = prompt(t('newName'), name); if(n && n !== name) act(() => api('admin/users/rename', {id, username:n}), t('renamed')); }},
  ...(self ? [] : [
    {label:t('logoutAll'), fn:() => act(() => api('admin/users/logout', {id}), t('loggedOut', name))},
    {label:t('deleteAccount'), cls:'dan', fn:() => sheet(t('deleteAccountQ', name), t('deleteAccountText'),
      [{label:t('deleteForever'), cls:'dan', fn:() => act(() => api('admin/users/delete', {id}), t('accountDeleted'))}])},
  ]),
]);
window.discType = k => { const D = state.disc; if(D.type === k) return; D.type = k; D.genre = null; D.section = null; D.results = []; route(); };
window.discGenre = g => { const D = state.disc; D.genre = g; D.section = null; D.results = []; route(); };
window.discSection = k => { const D = state.disc; D.section = k; D.genre = null; if(k) D.sort = 'rec'; D.results = []; route(); };
window.discSort = k => {
  const D = state.disc; D.sort = k; D.section = null; D.results = [];
  try { localStorage.setItem('wt-dsort', k); } catch {}
  route();
};
function discQuery(page){
  const D = state.disc;
  if(D.section) return `discover?type=${D.type}&section=${D.section}&page=${page}`;
  return `discover?type=${D.type}&genre=${D.genre || ''}&sort=${D.sort === 'rec' ? 'pop' : D.sort}&page=${page}`;
}
window.searchType = k => { const S = state.search; if(S.type === k) return; S.type = k; S.results = []; S.page = 1; S.pages = 1; route(); if(S.q) setTimeout(() => runSearch(S.q), 0); };
function resultRow(r){
  return `<div class="result">
    <a href="#/${r.type}/${r.id}">${thumb(r.poster)}</a>
    <a href="#/${r.type}/${r.id}"><b>${esc(r.title)}</b> <span class="muted">${r.year || ''}</span><p>${esc(r.overview)}</p></a>
    ${r.status ? `<span class="tag">${stLabel(r.status)}</span>` : `<button class="btn" onclick="searchAdd('${r.type}',${r.id},this)">${t('add')}</button>`}
  </div>`;
}
function resultsHtml(){
  const S = state.search;
  if(!S.q) return empty(S.type === 'tv' ? t('searchShow') : t('searchMovie'), t('searchText'));
  if(!S.results.length) return empty(t('noResults'), t('noResultsText', S.q));
  return `<div id="infgrid">${S.results.map(resultRow).join('')}</div>` + (S.page < S.pages ? sentinel() : '');
}
function searchInfinite(){
  const S = state.search;
  infinite(async () => {
    const q = S.q, type = S.type;
    const r = await api(`search?type=${type}&page=${S.page + 1}&q=` + encodeURIComponent(q));
    if(q !== S.q || type !== S.type) return {html:'', more:false};
    S.results.push(...r.results); S.page = r.page; S.pages = r.total_pages;
    return {html: r.results.map(resultRow).join(''), more: S.page < S.pages};
  });
}
window.searchAdd = async (type, id, btn) => {
  btn.disabled = true;
  try { const r = await api('add', {type, id}); const st = r.item.status;
    btn.outerHTML = `<span class="tag">${stLabel(st)}</span>`; markStatus(type, id, st); toast(t('addedTo', stLabel(st)));
  } catch(e){ btn.disabled = false; toast(e.message); }
};
async function runSearch(v){
  const S = state.search; S.q = v.trim();
  const box = $('#results'); if(!box) return;
  if(!S.q){ S.results = []; box.innerHTML = resultsHtml(); return; }
  const type = S.type;
  try { const r = await api(`search?type=${type}&q=` + encodeURIComponent(S.q));
    if(S.q !== v.trim() || S.type !== type) return;
    S.results = r.results; S.page = r.page || 1; S.pages = r.total_pages || 1; box.innerHTML = resultsHtml(); searchInfinite(); }
  catch(e){ box.innerHTML = errorBox(e); }
}

if('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('/sw.js').catch(() => {});
boot();
